name: TableLint
description: Lint academic CSV, XLSX, and LaTeX tables before submission
author: coocoomaomao

branding:
  icon: grid
  color: green

inputs:
  path:
    description: Table file or directory to inspect
    required: false
    default: "."
  strict:
    description: Fail when warnings are present
    required: false
    default: "false"
  star-thresholds:
    description: Optional descending p-value thresholds, e.g. 0.05,0.01,0.001
    required: false
    default: ""
  python-version:
    description: Python version used to run TableLint
    required: false
    default: "3.12"

runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install TableLint
      shell: bash
      run: python -m pip install "${{ github.action_path }}"

    - name: Run TableLint
      shell: bash
      run: |
        args=(check "${{ inputs.path }}" --github-annotations)

        if [[ "${{ inputs.strict }}" == "true" ]]; then
          args+=(--strict)
        fi
        if [[ -n "${{ inputs.star-thresholds }}" ]]; then
          args+=(--star-thresholds "${{ inputs.star-thresholds }}")
        fi

        tablelint "${args[@]}"
