[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "tablelint"
version = "0.1.0"
description = "Lint academic tables before submission."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "coocoomaomao" }]
keywords = [
  "academic",
  "tables",
  "csv",
  "xlsx",
  "latex",
  "research",
  "publication",
  "linter",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering",
]
dependencies = [
  "openpyxl>=3.1",
  "rich>=13.7",
  "typer>=0.12",
]

[project.optional-dependencies]
dev = ["pytest>=8.2"]
release = ["build>=1.2", "twine>=5.1"]

[project.scripts]
tablelint = "tablelint.cli:app"

[project.urls]
Homepage = "https://github.com/coocoomaomao/TableLint"
Repository = "https://github.com/coocoomaomao/TableLint"
Issues = "https://github.com/coocoomaomao/TableLint/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/tablelint"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
