name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Test
        run: pytest -q
      - name: CLI smoke test
        run: |
          tablelint --help
          tablelint check examples/good-table.csv
          tablelint check examples/table.tex
          tablelint check examples/bad-table.csv --format json

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Build package
        run: |
          python -m pip install ".[release]"
          python -m build
          python -m twine check dist/*
      - name: Smoke-test built wheel
        run: |
          python -m venv /tmp/tablelint-wheel-test
          /tmp/tablelint-wheel-test/bin/python -m pip install dist/*.whl
          /tmp/tablelint-wheel-test/bin/tablelint --help
          /tmp/tablelint-wheel-test/bin/tablelint check examples/good-table.csv
